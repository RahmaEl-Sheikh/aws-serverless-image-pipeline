name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Lint CloudFormation / SAM template
        run: cfn-lint template.yaml
      - name: Unit tests (AWS mocked with moto)
        run: pytest -q
      - name: SAM build
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - run: sam build
